name: Verify all 18 research replay tasks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificates:
    name: All 18 replays (${{ matrix.optimization }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimization: ["", "-O", "-OO"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, inspected 2026-11-16
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, inspected 2026-11-16
        with:
          python-version: "3.12"
      - name: Challenge runner failure handling
        run: python -B ${{ matrix.optimization }} -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify and materialize all 21 frozen input files
        run: python -B ${{ matrix.optimization }} scripts/prepare_inputs.py --output .verification-inputs --report input-report.json
      - name: Require all 18 certificate replays
        run: python -B ${{ matrix.optimization }} scripts/verify_all.py --external-seed .verification-inputs/graph/seed.g6 --matrix-root .verification-inputs/matrices --require-external --report verification-report.json
